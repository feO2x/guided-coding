name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet run --project tools/GuidedCoding.ClaudeGenerator --configuration Release -- --check
      - run: dotnet test --configuration Release
      - name: Validate Agent Skills package
        run: gh skill publish --dry-run
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Validate Claude Code plugin
        env:
          DISABLE_AUTOUPDATER: "1"
        run: npx --yes @anthropic-ai/claude-code@latest plugin validate . --strict
