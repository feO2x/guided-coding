name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - run: dotnet run --project tools/GuidedCoding.ClaudeGenerator --configuration Release -- --check
      - run: dotnet test --configuration Release
      - name: Validate Agent Skills package
        run: gh skill publish --dry-run
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Validate Claude Code plugin
        env:
          DISABLE_AUTOUPDATER: "1"
        run: npx --yes @anthropic-ai/claude-code@latest plugin validate . --strict
