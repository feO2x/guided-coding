name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (MAJOR.MINOR.PATCH). Leave empty to derive it from the Conventional Commits since the last release.
        required: false
        type: string
      dry-run:
        description: Only show the proposed version without releasing.
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The release tool needs the full history and all tags to propose the next version.
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Validate Claude Code plugin
        env:
          DISABLE_AUTOUPDATER: "1"
        run: npx --yes @anthropic-ai/claude-code@latest plugin validate . --strict
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898208+github-actions[bot]@users.noreply.github.com"
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          args=(--yes)
          if [ -n "$VERSION" ]; then args+=(--version "$VERSION"); fi
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          dotnet run --project tools/GuidedCoding.Release -- "${args[@]}"
